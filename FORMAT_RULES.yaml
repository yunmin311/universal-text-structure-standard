standard_version: 0.3.6
schema_version: 1
rules:
- rule_id: SEM-001
  category: semantic
  title: 连续解释用正文
  severity: INFO
  condition: 主题需要先建立认知或解释因果
  preferred_action: 按模式保留充分解释；学习笔记讲清机制、完整例子与边界，不用术语压缩串替代推理
  forbidden_pattern:
  - 把连续解释拆成 bullet 或碎句
  exceptions:
  - 简单答案可一句结束；长期文档补齐独立阅读所需机制与证据
  validation_method: manual
  examples:
    good:
    - examples/good/self-attention.md
    - examples/good/project-inbox.md
    - examples/good/technical-handoff.md
    bad:
    - examples/bad/block-fragmentation.md
    - examples/bad/fragmented-explanation.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: SEM-002
  category: semantic
  title: 并列信息用列表
  severity: INFO
  condition: 同层信息需要独立查找、核对或执行
  preferred_action: 需要逐项使用时才列点；连续解释留正文，长列表复核分组
  forbidden_pattern:
  - 将多个独立属性挤入长句
  exceptions:
  - 短枚举可横向；长列表考虑重组，必要的完整枚举保留
  validation_method: manual
  examples:
    good:
    - examples/good/project-inbox.md
    - examples/good/technical-handoff.md
    - examples/good/workflow.md
    bad:
    - examples/bad/parallel-in-prose.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: SEM-003
  category: semantic
  title: 顺序与有限状态用编号
  severity: INFO
  condition: 执行顺序、优先级或严格有限状态需要明确枚举
  preferred_action: 严格步骤用编号；有限状态枚举标明非时序含义
  forbidden_pattern:
  - 无顺序并列信息伪装成步骤
  exceptions:
  - 状态比较优先表格；无顺序能力用 bullet
  validation_method: manual
  examples:
    good:
    - examples/good/project-inbox.md
    - examples/good/workflow.md
    bad:
    - examples/bad/unordered-steps.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: SEM-004
  category: semantic
  title: 稳定比较用表格
  severity: INFO
  condition: 多个对象共享可比较字段或需要状态总览
  preferred_action: 将对象与稳定字段放入表格
  forbidden_pattern:
  - 把长篇连续推理塞入表格
  exceptions:
  - 单个对象的说明可用正文或列表
  validation_method: manual
  examples:
    good:
    - examples/good/compact.md
    - examples/good/self-attention.md
    - examples/good/project-inbox.md
    - examples/good/technical-handoff.md
    bad:
    - examples/bad/comparison-in-prose.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: SEM-005
  category: semantic
  title: 标题表达真实层级
  severity: WARNING
  condition: 内容存在可独立定位的章节与子主题
  preferred_action: 小标题须有独立导航与展开职责；同一解释连续写，中文大章下仅在必要时独立编号
  forbidden_pattern:
  - 空泛标题、逐条规则升级标题、跳级
  exceptions:
  - 单句标题优先并入正文；确有独立导航价值可保留
  validation_method: static
  examples:
    good:
    - examples/good/self-attention.md
    - examples/good/project-inbox.md
    - examples/good/technical-handoff.md
    - examples/good/workflow.md
    bad:
    - examples/bad/block-fragmentation.md
    - examples/bad/meaningless-headings.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: SEM-006
  category: semantic
  title: 嵌套表达真实从属
  severity: INFO
  condition: 列表项确实包含子项
  preferred_action: 只有父子关系才嵌套
  forbidden_pattern:
  - 为装饰或缩进而嵌套并列项
  exceptions:
  - 多层真实从属可保留并人工复核
  validation_method: manual
  examples:
    good:
    - examples/good/workflow.md
    bad:
    - examples/bad/unnecessary-nesting.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: SEM-007
  category: semantic
  title: 精确内容与关系结构各用其形
  severity: INFO
  condition: 需要表达流转、关系或目录归属
  preferred_action: 先判断是否必须保留逐行布局；普通解释、短条件与短链回正文，共享字段用表格，真实代码保留围栏
  forbidden_pattern:
  - 把目录归属画成时间流程
  exceptions:
  - 短关系可在正文横向表达；引用块可用于原文、可复制指令、易错点与关键边界，少量语义图标须配文字标签
  validation_method: manual
  examples:
    good:
    - examples/good/compact.md
    - examples/good/self-attention.md
    - examples/good/workflow.md
    bad:
    - examples/bad/block-fragmentation.md
    - examples/bad/prose-in-code.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: PRE-001
  category: presentation
  title: 保留完整段落
  severity: WARNING
  condition: 一个主题被连续短段切碎
  preferred_action: 合并同一主题的 micro paragraphs 及无意义块分割；保留论证
  forbidden_pattern:
  - 每句话独占一段
  exceptions:
  - 2–5 段、3–6 句是 Chat 经验而非硬门槛；真实转折和独立结论可短段
  validation_method: heuristic
  examples:
    good:
    - examples/good/self-attention.md
    - examples/good/compact.md
    - examples/good/project-inbox.md
    - examples/good/technical-handoff.md
    bad:
    - examples/bad/block-fragmentation.md
    - examples/bad/micro-paragraphs.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: PRE-002
  category: presentation
  title: 避免文字墙
  severity: WARNING
  condition: 正文密集到难以定位关系
  preferred_action: 按真实语义分段；并列转列表；比较转表格
  forbidden_pattern:
  - 只为紧凑把不同关系揉成长段
  exceptions:
  - 完整复杂论证可保持长段
  validation_method: heuristic
  examples:
    good:
    - examples/good/self-attention.md
    - examples/good/compact.md
    - examples/good/project-inbox.md
    - examples/good/technical-handoff.md
    bad:
    - examples/bad/text-wall.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: PRE-003
  category: presentation
  title: 空白与列表紧凑
  severity: WARNING
  condition: 需要分隔块而非制造大片留白
  preferred_action: 同组内容靠近；复核全文后半篇的短块堆叠，简单列表项连续排列
  forbidden_pattern:
  - 连续空行、简单列表逐项空一行
  exceptions:
  - 复杂列表与渲染必需间隔保留；不设空白比例目标
  validation_method: heuristic
  examples:
    good:
    - examples/good/self-attention.md
    - examples/good/compact.md
    - examples/good/project-inbox.md
    - examples/good/workflow.md
    bad:
    - examples/bad/block-fragmentation.md
    - examples/bad/whitespace-abuse.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: PRE-004
  category: presentation
  title: 减少无意义标题与粗体伪标题
  severity: WARNING
  condition: 强调、字段标签和章节标题需要区分
  preferred_action: 保留真实讲解模块；字段与说明同段，粗体仅少量锚点，不逐段标重点
  forbidden_pattern:
  - 独立粗体行充当密集伪标题
  exceptions:
  - 确有结构价值的标题按 SEM-005 保留
  validation_method: heuristic
  examples:
    good:
    - examples/good/compact.md
    - examples/good/project-inbox.md
    - examples/good/technical-handoff.md
    bad:
    - examples/bad/fake-bold-headings.md
    - examples/bad/meaningless-headings.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: PRE-005
  category: presentation
  title: 短链横向长流程纵向
  severity: INFO
  condition: 需要展示关系链或 pipeline
  preferred_action: 短链横向；长且难读或含分支的流程纵向
  forbidden_pattern:
  - 短链机械拆成多行
  exceptions:
  - 按实际可读性判断；不设固定节点数
  validation_method: manual
  examples:
    good:
    - examples/good/compact.md
    - examples/good/workflow.md
    bad:
    - examples/bad/short-flow-vertical.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: REN-001
  category: render_safety
  title: 粗体标记成对
  severity: ERROR
  condition: 正文使用双星号强调
  preferred_action: 闭合双星号并保持正确边界
  forbidden_pattern:
  - 孤立或未闭合双星号
  exceptions:
  - 代码与转义中的字面星号不作为强调
  validation_method: static
  examples:
    good:
    - examples/good/compact.md
    bad:
    - examples/bad/bold-code-crossing.md
    - examples/bad/broken-emphasis.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: REN-002
  category: render_safety
  title: 行内代码闭合
  severity: ERROR
  condition: 文件名、标识符或命令使用反引号
  preferred_action: 用相同长度的反引号闭合代码跨度
  forbidden_pattern:
  - 缺少结束反引号
  exceptions:
  - 代码内容可含较短反引号；跨度可跨同一段的换行
  validation_method: static
  examples:
    good:
    - examples/good/compact.md
    - examples/good/workflow.md
    bad:
    - examples/bad/inline-unclosed.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: REN-003
  category: render_safety
  title: 代码围栏与数学块边界
  severity: ERROR
  condition: 使用代码围栏或显示数学块
  preferred_action: 代码围栏匹配闭合；数学定界符独立配对，不吞入普通 Markdown
  forbidden_pattern:
  - 围栏未闭合或错用字符
  exceptions:
  - 围栏内容按字面处理；数学边界只报启发式 WARNING，不宣称 TeX 已校验
  validation_method: static
  examples:
    good:
    - examples/good/compact.md
    - examples/good/workflow.md
    bad:
    - examples/bad/fence-unclosed.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: REN-004
  category: render_safety
  title: 字段边界与技术实体默认格式
  severity: WARNING
  condition: 语义字段或技术实体出现在说明中
  preferred_action: 技术实体只用 inline code；语义标签使用 **字段：** 内容
  forbidden_pattern:
  - 默认给文件名代码额外加粗；冒号单独加粗或边界错位
  exceptions:
  - 极少数有语义理由的合法粗体嵌套代码允许，须人工复核
  validation_method: static
  examples:
    good:
    - examples/good/compact.md
    - examples/good/technical-handoff.md
    bad:
    - examples/bad/project-inbox-regression.md
  status: active
  sources:
  - references/README.md#confirmed-policy
  - references/README.md#regression
- rule_id: REN-005
  category: render_safety
  title: 避免粗体与代码交叉
  severity: WARNING
  condition: 同一字段同时使用强调与行内代码
  preferred_action: 避免强调与代码交叉；合法嵌套不自动判错
  forbidden_pattern:
  - 将强调定界符藏进代码或跨越代码边界
  exceptions:
  - 教学中代码内字面星号合法；配对嵌套强调仅非默认例外
  validation_method: static
  examples:
    good:
    - examples/good/compact.md
    - examples/good/technical-handoff.md
    bad:
    - examples/bad/bold-code-crossing.md
    - examples/bad/project-inbox-regression.md
  status: active
  sources:
  - references/README.md#confirmed-policy
  - references/README.md#regression
- rule_id: REN-006
  category: render_safety
  title: 列表缩进可解释
  severity: WARNING
  condition: 列表有嵌套或续行
  preferred_action: 缩进对应父项内容起点；过深时复核真实从属
  forbidden_pattern:
  - 无法解释的缩进层级、过深嵌套
  exceptions:
  - 复杂真实层级允许人工确认；不统一强制两空格
  validation_method: heuristic
  examples:
    good:
    - examples/good/workflow.md
    bad:
    - examples/bad/deep-list.md
  status: active
  sources:
  - references/README.md#confirmed-policy
- rule_id: REN-007
  category: render_safety
  title: 表格分隔与列数匹配
  severity: ERROR
  condition: 使用管线式 Markdown 表格
  preferred_action: 表头、分隔行、数据行列数一致；分隔单元使用连字符
  forbidden_pattern:
  - 缺少或非法分隔行、明显列数不一致
  exceptions:
  - 转义管线不分列；本版本仅覆盖简单管线表格
  validation_method: static
  examples:
    good:
    - examples/good/compact.md
    bad:
    - examples/bad/table-columns.md
  status: active
  sources:
  - references/README.md#confirmed-policy
