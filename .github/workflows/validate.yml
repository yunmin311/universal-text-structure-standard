name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install PyYAML jsonschema
      - name: Validate registry
        run: python scripts/validate.py --schema
      - name: Run fixture and maintenance checks
        run: python scripts/validate.py --test
      - name: Run CLI and published example tests
        run: python -m unittest discover -s tests -p "test_*.py"
